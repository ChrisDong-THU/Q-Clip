[build-system]
requires = ["scikit-build-core", "pybind11", "cmake", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "phash_cuda"
version = "0.1.0"
description = "CUDA accelerated pHash calculation"
requires-python = ">=3.8"

[tool.scikit-build]
wheel.packages = ["src/phash_cuda"] 